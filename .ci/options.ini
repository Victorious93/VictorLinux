# VictorLinux build pins. Maintained in the Victorious fork.
# Revisions here are what the build uses. `scripts/prepare-sources.sh` resolves each to an
# exact commit SHA and records it in the build manifest. Nothing is fetched at boot.

[repositories]
llamacpp = https://github.com/ggml-org/llama.cpp
comfyui = https://github.com/comfyanonymous/ComfyUI
automatic = https://github.com/vladmandic/automatic
nvidia_pstated = https://github.com/sasha0552/nvidia-pstated

[revisions]
# llama.cpp b12374: built (CPU) and exercised end-to-end by tests/live_test.py during development.
llamacpp = b12374
# exact commit the tag must resolve to (prepare-sources.sh refuses to build if it differs)
llamacpp_commit = 9183a552e5fdcbdb5243f187f3a63204eca7dba9
# Optional packs. NOT build-verified in this fork yet -> experimental.
comfyui = v0.45.3
automatic = 65ddc61161474cc956422cd71efa6b6095d365d3
nvidia_pstated = v1.0.6

[files]
nvidia_pstated = nvidia-pstated

[rustdeskv]
# RustDeskV is built into every non-empty image (headless and gui). Turn it off with `--no-rustdeskv` or VICTOR_RUSTDESKV=0.
# INTERIM SOURCE: Victorious93/rustdeskV does not publish release artifacts yet (no releases, CI artifacts expire), so the pinned
# upstream RustDesk 1.5.3 release (the version the fork is based on) is used. When rustdeskV publishes a Linux .pkg.tar.zst
# and .deb, change `repository`/`version`/`arch_file` here and the two SHA-256 pins; nothing else needs to change.
repository = https://github.com/rustdesk/rustdesk
version = 1.5.3
arch_file = rustdesk-1.5.3-0-x86_64.pkg.tar.zst

[checksums]
# SHA-256 of the build-time downloads that are not git commits. prepare-sources.sh refuses to build on a mismatch, so a
# swapped file at the source host (the .sha256 next to the UI bundle is served from the same place) can no longer slip in.
# Pinned on 2026-11-25 by downloading each file once (trust on first use). Re-pin deliberately when a revision above changes.
llama_ui = 23ef779522d339537f30575992ee01a557ac32c3905ad4fa934d3fe8b0731e37
nvidia_pstated = 887d4e3b75ad95fa2a9072696aa4c676fa6df13b29ebca285003be28076e95cc
# RustDesk 1.5.3 Arch package. Equals the digest GitHub shows for the release asset (checked 2026-11-25).
rustdeskv_arch = e880bc2c3dfb5e22a4a9418945fbe963453f7579bc5692237f24cb59eb1a278f

[build]
# Arch Linux package snapshot (archive.archlinux.org/repos/YYYY/MM/DD). Pinning makes the package set
# reproducible and prevents mid-project breakage from rolling updates. Change deliberately.
arch_snapshot = 2026/11/13
# AMD GPU targets for the optional HIP build. gfx1030 = RDNA2 (Radeon RX 6800 / 6800 XT / 6900 XT).
hip_targets = gfx1030
# CUDA 13 dropped Pascal (sm_61) and Volta: Turing(75) Ampere(86) Ada(89) Blackwell(120)
cuda_architectures = 75;86;89;120

[strategy]
llamacpp = release
comfyui = release
nvidia_pstated = release+first
