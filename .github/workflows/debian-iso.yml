name: VictorLinux Debian ISO

# Builds the Debian edition on infrastructure YOU control: GitHub-hosted ubuntu-24.04 by default, or your own
# runner (set the `runner` input / repository variable VICTOR_RUNNER, e.g. "self-hosted"). No upstream secrets,
# no original-maintainer runner. Hosted-runner limits: 4 vCPU / 16 GB RAM / ~14 GB root disk (we build on /mnt),
# 6 h job limit; expect roughly 45-90 min. GPU inference tests CANNOT run on hosted runners (no GPU).
on:
  workflow_dispatch:
    inputs:
      runner: { description: "runs-on label", default: "ubuntu-24.04", type: string }
      profile: { description: "amd (default) or nvidia", default: "amd", type: choice, options: [amd, nvidia] }
  pull_request:
    paths: ["debian-edition/**", "tests/fetch_vm_model.sh", ".github/workflows/debian-iso.yml"]
  push:
    branches: [main]
    paths: ["debian-edition/**", ".github/workflows/debian-iso.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || github.sha }}
      - name: Static checks and unit tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          cd debian-edition
          python3 -I -m compileall -q config scripts tests
          for f in build.sh scripts/*.sh tests/*.sh config/hooks/live/*.chroot; do bash -n "$f"; done
          shellcheck -S error build.sh scripts/*.sh config/hooks/live/*.chroot
          python3 -I -m unittest discover -s tests -p 'test_*.py' -v

  iso:
    needs: checks
    runs-on: ${{ inputs.runner || vars.VICTOR_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || github.sha }}
      - name: Free disk space (hosted runners)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt
      - name: Install pinned Debian live-build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap xorriso squashfs-tools mtools dosfstools git curl ca-certificates
          cd "$(mktemp -d)"
          base=https://deb.debian.org/debian/pool/main
          curl -fsSLO $base/l/live-build/live-build_20250505+deb13u1_all.deb
          curl -fsSLO $base/d/debootstrap/debootstrap_1.0.145_all.deb
          curl -fsSLO $base/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          sha256sum -c <<'SUMS'
          58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  live-build_20250505+deb13u1_all.deb
          2f044d9eac26e91bdee55e2d5907216c62c094ef21a88b4482cfa154b3c70c03  debootstrap_1.0.145_all.deb
          9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  debian-archive-keyring_2025.1_all.deb
          SUMS
          sudo apt-get install -y ./*.deb
          lb --version
      - name: Build ISO
        run: sudo ./debian-edition/build.sh --profile "${{ inputs.profile || 'amd' }}" --workdir /mnt/victor-build --out "$PWD/out/debian"
      - name: Verify ISO (static)
        run: sudo ./debian-edition/scripts/verify-iso.sh "$(ls out/debian/*.iso | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: victorlinux-debian-${{ inputs.profile || 'amd' }}
          path: |
            out/debian/*.iso
            out/debian/*.sha256
            out/debian/*.manifest.json
            out/debian/build-*.log
          retention-days: 14
          if-no-files-found: error

  boot-test:
    # Boots the ISO that the `iso` job just built, under QEMU, and fails on a real defect. This is a VM boot,
    # NOT a real-hardware boot: it does not cover Secure Boot, physical drives, GPUs or the owner's firmware.
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: victorlinux-debian-${{ inputs.profile || 'amd' }}
          path: out/debian
      - name: Verify the downloaded ISO against its checksum
        run: cd out/debian && sha256sum -c *.sha256
      - name: Install QEMU and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf xorriso e2fsprogs imagemagick
      - name: Enable KVM when the runner offers it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will use TCG (slow)"
      - name: Boot smoke test (kernel/initrd from the ISO, offline)
        run: sudo python3 -I debian-edition/tests/vm_test.py smoke "$(ls out/debian/*.iso | head -1)" out/boot-test
      - name: Bootloader test (BIOS and UEFI, real bootloader from the ISO)
        run: sudo python3 -I debian-edition/tests/vm_test.py bootloader "$(ls out/debian/*.iso | head -1)" out/boot-test
      - name: Fetch the checksummed offline inference fixture
        run: bash tests/fetch_vm_model.sh out/vm-fixtures/stories15M-q4_0.gguf
      - name: Test first boot, credential restoration and offline inference
        run: sudo python3 -I debian-edition/tests/vm_test.py full "$(ls out/debian/*.iso | head -1)" out/vm-fixtures/stories15M-q4_0.gguf out/boot-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-${{ inputs.profile || 'amd' }}
          path: |
            out/boot-test/*.png
            out/boot-test/*.json
            out/boot-test/vm/*.log
            out/boot-test/vm/*.err
          retention-days: 14
          if-no-files-found: warn
