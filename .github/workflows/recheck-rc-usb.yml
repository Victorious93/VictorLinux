name: Fleet and removable-storage checks
on:
  push:
    branches: [qa/live-usb-rc1]
permissions:
  contents: read
jobs:
  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce049acb9a5e79ac6e038c3032eceee873a141be
      - name: Run the coordinator against simulated phone workers
        run: python3 -m unittest discover -s fleet/tests -p 'test_*.py'
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce049acb9a5e79ac6e038c3032eceee873a141be
      - name: Install disk test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pytest python3-jinja2 gdisk parted e2fsprogs
      - name: Test data persistence on file-backed block devices
        run: |
          test_root=$(mktemp -d /var/tmp/victor-qa.XXXXXXXX)
          chmod 755 "$test_root"
          git archive HEAD | tar -x -C "$test_root"
          sudo bash "$test_root/tests/root_persist.sh"
      - name: Test storage discovery, writer and updates
        run: sudo /usr/bin/python3 -m pytest -q -rs tests/test_storage_loop.py tests/test_make_usb_loop.py tests/test_usb_update.py
