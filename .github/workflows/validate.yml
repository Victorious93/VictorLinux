name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-jinja2 python3-pytest
      - name: Render every profile (templates must always render)
        run: |
          for p in "amd headless" "amd gui" "amd empty" "cuda headless" "cuda gui" "rocm headless"; do
            python3 .ci/configure.py $p >/dev/null
          done
          python3 .ci/configure.py cuda gui --packs comfyui,sillytavern,vllm >/dev/null
          python3 .ci/configure.py amd headless >/dev/null
      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh airootfs/usr/local/bin/victor-open airootfs/usr/local/bin/victor-tls-cert \
            airootfs/usr/local/bin/victor-bench airootfs/usr/local/bin/victor-phone airootfs/usr/local/bin/victor-secbackend \
            airootfs/usr/local/lib/victorlinux/victor-boot-setup \
            airootfs/root/customize_airootfs.sh airootfs/root/customize_airootfs/root-scripts/*.sh \
            airootfs/root/customize_airootfs/scripts/*.sh profiledef.sh \
            debian-edition/config/includes.chroot_after_packages/usr/local/bin/victor-phone \
            debian-edition/config/hooks/live/0250-optional-scrcpy.hook.chroot
          bash -n profiledef.sh
      - name: Python
        run: |
          python3 -m py_compile airootfs/usr/local/lib/victorlinux/*.py airootfs/usr/local/lib/victorlinux/victor-priv airootfs/usr/local/bin/victor-storage airootfs/usr/local/bin/victor-check airootfs/usr/local/bin/victor-input airootfs/usr/local/bin/victor-bt-pair scripts/victor_layout.py debian-edition/config/includes.chroot_after_packages/usr/local/lib/victorlinux/victorinput.py debian-edition/config/includes.chroot_after_packages/usr/local/bin/victor-input debian-edition/config/includes.chroot_after_packages/usr/local/bin/victor-bt-pair airootfs/usr/local/bin/victor-phone-gui airootfs/usr/local/bin/victor-phone-dash airootfs/usr/local/bin/victor-phone-headless debian-edition/config/includes.chroot_after_packages/usr/local/bin/victor-phone-gui debian-edition/config/includes.chroot_after_packages/usr/local/bin/victor-phone-headless debian-edition/config/includes.chroot_after_packages/usr/local/lib/victorlinux/victorphone.py
          python3 -m pytest -q tests debian-edition/tests/test_logic.py debian-edition/tests/test_layout.py
      - name: Browser regression checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/browser_ui.js
