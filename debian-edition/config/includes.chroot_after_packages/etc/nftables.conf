#!/usr/sbin/nft -f
# Default: no inbound connections except explicitly opened ports (see victor-priv fw-sync / ssh-enable).
flush ruleset
table inet victor {
  set allowed_tcp { type inet_service; }
  # Wi-Fi hotspot interfaces (victor-priv hotspot-fw): DHCP/DNS from joined devices, never forwarded anywhere
  set hotspot_if { type ifname; }
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    tcp dport @allowed_tcp accept
    iifname @hotspot_if udp dport { 53, 67 } accept
    iifname @hotspot_if tcp dport 53 accept
  }
  chain forward {
    type filter hook forward priority 0; policy accept;
    iifname @hotspot_if drop
    oifname @hotspot_if drop
  }
}
