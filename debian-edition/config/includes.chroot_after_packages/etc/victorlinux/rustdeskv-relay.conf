# RustDeskV self-hosted server (optional). Every value is EMPTY on purpose: with nothing set, RustDeskV uses the
# public RustDesk rendezvous and relay servers. Nothing here is a secret except that you must never put a password
# in this file: `key` is your server's PUBLIC key (the contents of id_ed25519.pub on your hbbs server).
#
# To use your own server, fill these in as root and restart: systemctl restart victor-rustdeskv
#   rendezvous_server = hbbs.example.com:21116
#   relay_server      = hbbr.example.com:21117
#   api_server        =                              (https://host, optional)
#   key               = <public key from your server>
#
# Emptying a value and restarting returns to the public servers. Invalid values stop the host from starting.
rendezvous_server =
relay_server =
api_server =
key =
